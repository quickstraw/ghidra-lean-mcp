# Catalog data: installed-extension registry. Data-only growth (plan §6.2):
# adding a console is an appended [extension.<id>] table, never code.

[extension.allegrex]
title       = "Allegrex (PSP) processor + PSP ELF loader"
repo        = "kotcrab/ghidra-allegrex"
module_name = "ghidra-allegrex"
provides    = { languages = ["Allegrex"], loaders = ["PSP Executable (ELF)"] }
asset_regex = ".*ghidra-allegrex\\.zip$"
ghidra_min  = "12.0"
consoles    = ["psp"]
validate    = true

[extension.switch]
title       = "Nintendo Switch NSO/NRO/KIP loader"
repo        = "Adubbz/Ghidra-Switch-Loader"
module_name = "Ghidra-Switch-Loader"
provides    = { loaders = ["Nintendo Switch NSO", "NRO", "KIP"] }
consoles    = ["switch"]
validate    = true
build       = { tool = "gradlew", jdk = 21 }   # no prebuilt asset per Ghidra release

[extension.ee-reloaded]
title       = "PS2 EE (R5900) processor + IRX loader"
repo        = "chaoticgd/ghidra-emotionengine-reloaded"
module_name = "ghidra-emotionengine-reloaded"
provides    = { languages = ["MIPS:LE:32:R5900"], loaders = ["PS2 ELF", "IRX"] }
asset_regex = ".*emotionengine-reloaded\\.zip$"
consoles    = ["ps2"]
validate    = true

