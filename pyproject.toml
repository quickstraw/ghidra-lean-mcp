[project]
name = "ghidra-headless-mcp"
version = "0.1.0"
description = "Lean headless Ghidra MCP server for reverse engineering video games."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
  "click>=8.1,<8.4",
  "mcp>=2.1,<3",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.15.0",
  "pyghidra>=3.1.0",
  "typer>=0.27.1",
]

[project.scripts]
ghmcp = "ghmcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghmcp"]

[dependency-groups]
dev = [
  "import-linter>=2.13",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "ruff>=0.16.4",
  "tiktoken>=0.14.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "live: requires a Ghidra install (GHIDRA_INSTALL_DIR) — run with -m live",
    "perf: perf-gate scenarios (§5.5) — run with -m perf",
]

[tool.importlinter]
root_package = "ghmcp"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "App layers (tools -> services -> ghidra -> runtime -> platform)"
type = "layers"
layers = [
    "ghmcp.tools",
    "ghmcp.services",
    "ghmcp.ghidra",
    "ghmcp.runtime",
    "ghmcp.platform",
]

[[tool.importlinter.contracts]]
name = "Ghidra/JPype imports are allowed in ghidra/ and runtime/ only"
type = "forbidden"
source_modules = [
    "ghmcp.tools",
    "ghmcp.services",
    "ghmcp.platform",
    "ghmcp.server",
    "ghmcp.__main__",
]
forbidden_modules = ["ghidra", "jpype", "pyghidra"]
allow_indirect_imports = true
